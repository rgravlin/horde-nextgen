# Static hosting for the bundle in dist/. nginx.conf includes this from its http
# block, so mime.types is already inherited; this file is one server block only.

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Textures, .glb and .hdr are already compressed; gzip the text.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml application/wasm;

    # Vite content-hashes these, so they can be cached hard. index.html must NOT
    # be cached, or a fresh build stays invisible until a hard reload.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Single page, no router: unknown paths are missing files, not routes, so
    # there is no try_files ... /index.html fallback here on purpose.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ =404;
    }

    # Missing from nginx's mime.types. three.js fetches both as ArrayBuffer and
    # works either way, but octet-stream makes the Network panel unreadable.
    location ~* \.glb$ { default_type model/gltf-binary; }
    location ~* \.hdr$ { default_type image/vnd.radiance; }
}